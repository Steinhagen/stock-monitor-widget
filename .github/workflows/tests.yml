name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qml-tests:
    name: QML tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Qt 6 test tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qt6-declarative-dev-tools \
            qt6-qpa-plugins \
            qml6-module-qtqml \
            qml6-module-qtquick \
            qml6-module-qttest

      - name: Run the harness
        run: ./tests/run.sh
